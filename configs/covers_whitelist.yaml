# Class-pair rulings for `python -m tda.cli pixel-edges` (tasks W3a, W3g) -- the USER's
# class-level answers (2026-10-31 night) to
# docs/superpowers/discussions/2026-10-30-vlm-paper-scope/08-class-pair-questions.md.
#
# Who blocks whom is still decided per instance pair in Review when the user wants to
# (table `cover_ruling`, task W3c): an explicit ruling there always wins over this file.
# `pixel-edges` turns a `blocks` ruling into a `covered_by` edge (source `review:covers`).
# This file says which UNRULED pairs the user has already decided for the whole class:
#
# * `pairs:` -- the user ruled 挡. Without `--allow-unruled` the matching coverings are
#   listed as suggestions; with it they are written with source `pixels:<version>`,
#   status accepted, necessity required, as the row of the pair's `edge`:
#     covered_by            (default) covered_by(below <- above): every verb on `below`
#                           waits until `above` is open / removed / displaced;
#     blocked_by.contained  blocked_by(below <- above, mode=contained): `above` is a load
#                           `below` carries (a drive in the cage, the optical drive on it):
#                           only `below`'s `remove` waits, and only for `above` removed --
#                           the cage may be swung aside with the drives still inside;
#     blocked_by.physical_path  blocked_by(below <- above, mode=physical_path).
# * `not_blocks:` -- the user ruled 不挡 (the order is a habit, not a constraint). Never
#   written; Review folds such pairs into 「用户已定不挡（类级）」 and asks nothing.
#
# A pair `(above, below)` of one desktop is written when it is a covering on the
# confirmed scan frames that nothing accounts for (no edge either way, no structural
# reason -- the export-time support table `rule.supported_by` included), the recorded log
# keeps every constraint with the row added (`would_violate` otherwise: back to the
# user), and
#     max_px >= max(min_px, min_frac * amodal_area(below))
# where amodal_area is below's whole-shape area on the frame of max_px (`min_px` alone,
# and the pair flagged, when that area is unknown). `above` / `below` name a class
# (`optical_drive`) or a class refined by its kind (`storage_drive.ssd`); a pair may
# override the thresholds. Small lower parts (the CPU, the socket lever, a RAM stick) use
# min_frac 0.25.
#
# Refused by the loader (decided elsewhere, or too noisy): `cover -> motherboard`,
# `expansion_card.wlan|other -> *` (and a bare `expansion_card` above), any `below`
# that is a screw, a connector or a cable, and cpu / ram_module / cpu_cooler /
# expansion_card -> motherboard: a RULE EDGE since task W3d (spec 7.3 「主板上的东西先拆」,
# blocked_by(motherboard <- part, mode=mounted) for every real part), never a candidate,
# never shown in Review. A class pair in both lists is refused too.
#
# W3 (2026-10-31, late night): the user looked at the pair cards and decided the rest --
# B6-B10, A6-A8, C11 / D3, E1-E5 (「用我们的拆解的顺序作为主要参考」). The reversed pairs the
# cards showed (hdd / ssd painted OVER the Dell PSU module that folds down on them, the GPU over
# the blue cover.02 that opens first, cover.02 over the fan shroud cover.01) were layer-order
# errors and were corrected in the data (pair overrides / a layer move), not ruled here: a
# `hdd -> psu` pair is therefore neither 挡 nor 不挡 -- it should not exist.
version: W4
defaults:
  min_px: 1000
  min_frac: 0.03
pairs:
  # ---- A: large parts -> motherboard (挡)
  - {above: drive_cage, below: motherboard, note: "A1 挡"}
  - {above: optical_drive, below: motherboard, note: "A2 挡"}
  - {above: storage_drive.ssd, below: motherboard, note: "A3 挡"}
  - {above: storage_drive.hdd, below: motherboard, note: "A5 挡：机械硬盘要求先于主板拿走"}
  - {above: case_fan, below: motherboard, note: "A6 挡：机箱风扇挡着主板"}
  - {above: cooler_bracket, below: motherboard, note: "A7 挡：散热器支架挂在主板上，要求先把支架拿走"}
  # ---- B: the drive cage and what it carries
  - {above: optical_drive, below: drive_cage, edge: blocked_by.contained,
     note: "B1 挡：光驱是硬盘架最上面一层，先拿走光驱才能拿走架子"}
  - {above: storage_drive.ssd, below: drive_cage, edge: blocked_by.contained,
     note: "B2 挡：SSD 在硬盘架里，先拿走盘才能拿走架子"}
  - {above: storage_drive.hdd, below: drive_cage, edge: blocked_by.contained,
     note: "B5 挡：HDD 在硬盘架里，先拿走盘才能拿走架子"}
  - {above: optical_drive, below: storage_drive.ssd,
     note: "B3 挡：光驱在盘的上面一层（用户 2026-10-31 看图确认：「前几个都是光驱，我确定挡着下面的部分」）"}
  - {above: optical_drive, below: storage_drive.hdd,
     note: "B4 挡：光驱在盘的上面一层（用户 2026-10-31 看图确认）"}
  - {above: drive_cage, below: storage_drive.hdd, note: "B6 挡：架子先翻开才拿得到盘"}
  # ---- D: -> ram_module (挡)
  - {above: drive_cage, below: ram_module, min_frac: 0.25, note: "D1 挡：先弄走硬盘架再弄内存"}
  - {above: optical_drive, below: ram_module, min_frac: 0.25, note: "D2 挡：先弄走光驱再弄内存"}
  - {above: case_fan, below: ram_module, min_frac: 0.25, note: "D3 挡：掉出来的机箱风扇先拿走"}
  # ---- C11: a case fan that fell out comes out first
  - {above: case_fan, below: cpu, min_frac: 0.25, note: "C11 挡：掉出来的机箱风扇先拿走"}
  - {above: case_fan, below: cpu_socket_lever, min_frac: 0.25,
     note: "C11 挡：掉出来的机箱风扇先拿走"}
  - {above: case_fan, below: expansion_card.gpu, note: "C11 挡：掉出来的机箱风扇先拿走"}
  - {above: case_fan, below: cpu_cooler.fan, note: "C11 挡：掉出来的机箱风扇先拿走"}
  - {above: case_fan, below: storage_drive.ssd, note: "C11 挡：掉出来的机箱风扇先拿走（用户 2026-10-31 看图确认）"}
  # ---- W3: the pairs the user decided on the cards (2026-10-31 late night)
  - {above: misc_part, below: motherboard, note: "A8 挡：机箱接口面板挡着主板（看图确认）"}
  - {above: storage_drive.ssd, below: optical_drive, note: "B7 挡：SSD 挡着光驱（看图确认）"}
  - {above: storage_drive.ssd, below: psu, note: "B9 挡：需要移走 SSD 才能动电源（看图确认；电源翻下来压住 SSD 的那种是层序画反了，数据里已改成电源在上）"}
  - {above: psu, below: storage_drive.ssd, note: "B10 挡：电源模块要翻开才能拿出里面的 SSD（看图确认）"}
  - {above: psu, below: storage_drive.hdd, note: "B8 挡：电源模块要翻开才能拿出里面的 HDD，电源在硬盘前面（看图确认）"}
  - {above: cover, below: cover, note: "E1 挡：上面的盖板 / 导风罩先开（看图确认；D49、D62 的导风罩 cover.01 已改到其它盖板之上）"}
  - {above: cover, below: expansion_card, note: "E2 挡：先打开盖板才能拆到扩展卡（看图确认）"}
  - {above: storage_drive.ssd, below: cover, note: "E3 挡：SSD 在导风罩上面，先拿走 SSD（看图确认）"}
  - {above: cover, below: psu, note: "E4 挡：先打开 / 拿走盖板再拆电源（看图确认）"}
  - {above: optical_drive, below: optical_drive, note: "E5 挡：上面的光驱先拆（D36 看图确认）"}
  # ---- W4: the 47 cards (2026-10-31 late night, Q08-Q12 / Q15-Q25: D49 D62 D63): 「这个导风罩挡住了下面所有的东西」
  - {above: cover, below: ram_module, min_frac: 0.25, note: "W4 挡：导风罩 / 内存盖板挡住下面的内存条，橙色的先拿走（看图确认 Q08–Q25）"}
  - {above: cover, below: cpu_cooler, note: "W4 挡：导风罩同时挡住散热器（看图确认 Q12 Q19）"}
not_blocks:
  # ---- A4: independent parts; PSU first is only the habit
  - {above: psu, below: motherboard, note: "A4 不挡：电源和主板是独立的，先电源再主板只是习惯"}
  # ---- C1-C10: drives / cage -> CPU, lever, cooler: only the usual order, no constraint
  - {above: drive_cage, below: cpu, note: "C 不挡：只是拆的习惯顺序"}
  - {above: drive_cage, below: cpu_socket_lever, note: "C 不挡：只是拆的习惯顺序"}
  - {above: drive_cage, below: cpu_cooler, note: "C 不挡：只是拆的习惯顺序"}
  - {above: optical_drive, below: cpu, note: "C 不挡：只是拆的习惯顺序"}
  - {above: optical_drive, below: cpu_socket_lever, note: "C 不挡：只是拆的习惯顺序"}
  - {above: optical_drive, below: cpu_cooler, note: "C 不挡：只是拆的习惯顺序"}
  - {above: storage_drive, below: cpu, note: "C 不挡：只是拆的习惯顺序"}
  - {above: storage_drive, below: cpu_socket_lever, note: "C 不挡：只是拆的习惯顺序"}
  - {above: storage_drive, below: cpu_cooler, note: "C 不挡：只是拆的习惯顺序"}
  # ---- D4: a drive on its own has nothing to do with the RAM
  - {above: storage_drive.ssd, below: ram_module, note: "D4 不挡：独立的硬盘和内存没关系，谁先后都可以"}
  - {above: storage_drive.hdd, below: ram_module, note: "D4 不挡：独立的硬盘和内存没关系，谁先后都可以"}
